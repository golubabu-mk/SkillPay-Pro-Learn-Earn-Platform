name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Build frontend
        run: cd frontend && npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        # Uses npm install instead of npm ci just in case package-lock is missing
        run: cd backend && npm install
      - name: Build backend
        run: cd backend && npm run build
      - name: Run tests
        run: cd backend && npm test

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: rustfmt, clippy
          override: true
      
      - name: Check Formatting
        run: cd contracts/skillpay_reward_contract && cargo fmt -- --check
        
      - name: Run Clippy (Linter)
        run: cd contracts/skillpay_reward_contract && cargo clippy --all-targets --all-features -- -D warnings
        
      - name: Run Tests
        run: cd contracts/skillpay_reward_contract && cargo test

      - name: Build contract
        run: cd contracts/skillpay_reward_contract && cargo build --target wasm32-unknown-unknown --release

      - name: Verify Testnet Deployment Workflow Script
        run: |
          if [ ! -f contracts/skillpay_reward_contract/deploy_testnet.sh ]; then
            echo "Deployment script missing!"
            exit 1
          fi
          chmod +x contracts/skillpay_reward_contract/deploy_testnet.sh
          # Dry-run or syntax check (optional)

  deploy-frontend:
    needs: [frontend, contract]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: '--prod'
